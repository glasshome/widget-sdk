name: Publish to npm

# release-please keeps a release PR open on main; merging it creates the tag
# and the GitHub release. Publishing is keyed on one fact, not on that step's
# output: package.json's version has a tag and npm does not have it yet. So a
# rerun after a failed publish publishes, and a plain push does not. Releases
# created with GITHUB_TOKEN never trigger other workflows, which is why this
# stays one job.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          release-type: node

      - uses: actions/checkout@v4
      # npm >= 11.5.1 (node 24) does the OIDC exchange itself; auth is the
      # npmjs trusted-publisher binding (org glasshome, this repo, this file).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - id: gate
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          git fetch --tags --quiet
          if [ -z "$(git tag -l "v$version")" ]; then
            echo "no tag v$version yet, plain push"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already on npm"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version tagged and not yet on npm, publishing"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for pinned @glasshome dependencies on npm
        if: ${{ steps.gate.outputs.go == 'true' }}
        run: |
          set -euo pipefail
          deps=$(node -e '
            const pkg = require("./package.json");
            const all = { ...pkg.dependencies, ...pkg.devDependencies, ...pkg.peerDependencies };
            for (const [name, version] of Object.entries(all)) {
              if (name.startsWith("@glasshome/") && /^\d/.test(version)) {
                console.log(`${name}@${version}`);
              }
            }
          ')
          if [ -z "$deps" ]; then
            echo "no pinned @glasshome dependencies to wait for"
            exit 0
          fi
          for dep in $deps; do
            ok=false
            for attempt in $(seq 1 45); do
              tarball=$(npm view "$dep" dist.tarball 2>/dev/null || true)
              if [ -n "$tarball" ] && curl -sfI "$tarball" >/dev/null 2>&1; then
                ok=true
                break
              fi
              echo "waiting for $dep (attempt $attempt)"
              sleep 20
            done
            if [ "$ok" != true ]; then
              echo "::error::timed out waiting for $dep on npm"
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.gate.outputs.go == 'true' }}
        with:
          bun-version: 1.4.4
      - run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            echo "bun install failed (attempt $attempt)"
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1
        if: ${{ steps.gate.outputs.go == 'true' }}
      # A published SDK ships no changelog; its dist/export-history.json is complete because of this step.
      - run: bun scripts/backfill-export-history.ts
        if: ${{ steps.gate.outputs.go == 'true' }}
      - run: bun run build
        if: ${{ steps.gate.outputs.go == 'true' }}
      - run: bun run typecheck:test
        if: ${{ steps.gate.outputs.go == 'true' }}
      - run: bunx playwright install --with-deps chromium
        if: ${{ steps.gate.outputs.go == 'true' }}
      - run: bun run test
        if: ${{ steps.gate.outputs.go == 'true' }}
        env:
          EXPORT_HISTORY_COMPLETE: "1"
          EXPORT_HISTORY_REQUIRE_TAGS: "1"
      - run: npm publish --provenance --access public
        if: ${{ steps.gate.outputs.go == 'true' }}

  # Every tag carries an export history complete through the release before it:
  # the release PR branch gets the backfilled export-history.json. A push made
  # with GITHUB_TOKEN starts no workflow, so this job cannot trigger itself.
  history:
    needs: release
    if: ${{ needs.release.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: pr
        env:
          PR: ${{ needs.release.outputs.pr }}
        run: echo "branch=$(jq -r '.headBranchName // empty' <<<"$PR")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        if: ${{ steps.pr.outputs.branch != '' }}
      - run: bun scripts/backfill-export-history.ts
        if: ${{ steps.pr.outputs.branch != '' }}
      - name: Commit the history to the release PR branch
        if: ${{ steps.pr.outputs.branch != '' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- export-history.json; then
            echo "export-history.json already complete"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export-history.json
          git commit -m "chore: complete the export history through the previous release" -- export-history.json
          git push
