name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      # `bun run test` = logic suite (bun test src) + mount suite (vitest,
      # tests/dom). Plain `bun test` would collect the JSX files it cannot compile.
      - run: bun run test
