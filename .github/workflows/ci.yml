name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release tags feed the export history coverage test.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      # `bun run test` = logic suite (bun test src) + mount suite (vitest,
      # tests/dom). Plain `bun test` would collect the JSX files it cannot compile.
      - run: bun run test
        env:
          EXPORT_HISTORY_REQUIRE_TAGS: "1"
      # Also runs at publish. Here too, or a type error in a test first appears
      # after release-please has already cut the tag.
      - run: bun run typecheck:test
      - run: bun run check:dead
